name: Dispatcher CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run complete Python suite
        run: python -B -m unittest discover -s . -p 'test_*.py' -v

  powershell-and-static:
    name: PowerShell and static checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -LiteralPath . -Filter '*.ps1' -File | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
          }
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Check Python 3.10 grammar
        shell: pwsh
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p), feature_version=(3,10)) for p in pathlib.Path('.').glob('*.py')]"
      - name: Check whitespace and credential patterns
        shell: pwsh
        run: |
          git diff --check HEAD^ HEAD
          $matches = git grep -n -I -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- . ':!docs/validation.md'
          if ($LASTEXITCODE -eq 0 -and $matches) { $matches; exit 1 }

  workflow-validation:
    name: Workflow and template validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.10'
      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt
      - name: Validate workflow and setup template
        run: python ci/validate_yaml.py
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Run actionlint
        run: "$(go env GOPATH)/bin/actionlint" .github/workflows/ci.yml
